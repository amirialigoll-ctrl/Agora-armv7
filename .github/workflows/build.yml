name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 'secrets' can't be referenced directly inside a step's `if:` (GitHub Actions
      # restriction) — so resolve presence once here at job level, where secrets IS
      # allowed, and have the step check this env var instead.
      HAS_SIGNING_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - id: setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Restore signing key
        if: ${{ env.HAS_SIGNING_SECRET == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.jks
          cat >> local.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - uses: gradle/actions/setup-gradle@v4

      # Build proot native binaries for BOTH ABIs (arm64-v8a + armeabi-v7a) before Gradle,
      # matching what local dev machines do via build.ps1/build_fdroid.ps1.
      - name: Build proot native binaries (arm64-v8a + armeabi-v7a)
        run: |
          chmod +x ./build-proot.sh
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./build-proot.sh --force

      - name: Build F-Droid Debug APK
        run: chmod +x ./gradlew && ./gradlew assembleFdroidDebug

      - name: Build F-Droid Release APK
        run: ./gradlew assembleFdroidRelease

      - name: Verify armeabi-v7a is present in both APKs
        run: |
          set -euo pipefail
          fail=0
          for apk in $(find app/build/outputs/apk/fdroid -name "*.apk"); do
            echo "=== Checking $apk ==="
            if ! unzip -l "$apk" | grep -q "lib/armeabi-v7a/"; then
              echo "::error::armeabi-v7a native libraries missing from $apk"
              fail=1
            else
              echo "OK: armeabi-v7a present"
              unzip -l "$apk" | grep "lib/armeabi-v7a/"
            fi
            if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/"; then
              echo "::error::arm64-v8a native libraries missing from $apk"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more APKs are missing a required ABI. Failing build."
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: agora-fdroid-release
          path: app/build/outputs/apk/fdroid/release/*.apk

      - name: Remove temporary signing keystore
        if: always()
        run: |
          rm -f ${{ github.workspace }}/release.jks
          # local.properties may also hold the plaintext store/key passwords appended above
          rm -f ${{ github.workspace }}/local.properties
          echo "Temporary signing material removed from runner."
